<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<title>Phiếu B1 — Seikin</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1a1d23;--muted:#6b7280;--line:#e3e6ea;--brand:#0f766e;--brand-soft:#e6f4f1;
 --warn:#b45309;--warn-soft:#fef3c7;--ok:#15803d;--ok-soft:#dcfce7;--err:#b91c1c;--err-soft:#fee2e2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:96px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{background:var(--brand);color:#fff;padding:22px 16px 18px}
header .wrap{padding:0} h1{margin:0 0 6px;font-size:21px;line-height:1.3} header p{margin:0;opacity:.92;font-size:14px}
.track{height:4px;background:rgba(255,255,255,.25);margin-top:14px;border-radius:2px;overflow:hidden}.bar{height:100%;width:0;background:#fff;transition:width .3s}
.lock{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:24px 0}
.lock input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:17px;letter-spacing:.08em;margin:8px 0}
.btn{display:inline-block;padding:11px 16px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand)} .btn:focus-visible{outline:3px solid #99f6e4;outline-offset:2px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:16px 0;overflow:hidden}
.sh{padding:14px 16px;border-bottom:1px solid var(--line);background:#fafbfc;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.sh h2{margin:0;font-size:16px} .sh p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.skip{font-size:13px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center;cursor:pointer}
.sec.skipped .sb{display:none} .sec.skipped{opacity:.6}
.sb{padding:4px 16px 16px}
.q{padding:14px 0;border-bottom:1px dashed var(--line)} .q:last-child{border-bottom:0}
.qt{font-weight:650;margin:0 0 8px;font-size:15px}
.refs{display:grid;gap:4px;margin:0 0 10px}
.ref{font-size:13.5px;background:#f8fafc;border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.ref b{display:inline-block;min-width:92px;color:var(--brand);font-size:12px;letter-spacing:.02em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1;min-width:92px;text-align:center;padding:9px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14.5px;font-weight:600}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked).y{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg label:has(input:checked).s{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.seg label:has(input:checked).u{background:#eef0f2;border-color:#9ca3af;color:#4b5563}
.seg label:has(input:focus-visible){outline:3px solid #99f6e4}
.fix{margin-top:8px;display:none;gap:8px} .q.fixing .fix{display:grid}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
input[type=text],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.opt{display:block;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer;font-size:14.5px}
.opt input{margin-right:8px} .opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.bar-b{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px}
.bar-b .wrap{padding:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.bar-b .st{margin-right:auto;font-size:13px;color:var(--muted)}
pre#out{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;font-size:13px;max-height:320px;overflow:auto}
.msg{padding:9px 12px;border-radius:8px;font-size:14px;margin:8px 0} .msg.err{background:var(--err-soft);color:var(--err)} .msg.ok{background:var(--ok-soft);color:var(--ok)}
</style></head><body>
<header><div class="wrap"><h1>Phiếu B1 — Bảng giá &amp; cách thu phí</h1>
<p>Đính chính giá và cách thu đang làm thật, để Trợ lý Seikin trả lời đúng. ~10–15 phút · tự lưu, bỏ dở quay lại được.</p>
<div class="track"><div class="bar" id="bar"></div></div></div></header>
<main class="wrap">
 <div class="lock" id="lock"><b>Nhập mã mở phiếu</b> (anh Hiến gửi qua Zalo)
  <input id="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Mã mở phiếu">
  <button class="btn" id="open">Mở phiếu</button><div id="lmsg"></div></div>
 <div id="form" hidden></div>
 <section class="sec" id="exp" hidden><div class="sh"><div><h2>Gửi kết quả</h2><p>Bấm <b>Chép</b> rồi dán vào Zalo gửi anh Hiến, hoặc <b>Tải file</b> rồi gửi file.</p></div></div>
  <div class="sb"><pre id="out"></pre><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
  <button class="btn" id="copy">Chép</button><button class="btn ghost" id="dl">Tải file</button></div><div id="emsg"></div></div></section>
</main>
<div class="bar-b" id="bb" hidden><div class="wrap"><span class="st" id="st"></span>
 <button class="btn ghost" id="clear">Xoá hết</button><button class="btn" id="done">Xong — xem kết quả</button></div></div>

let SPEC=null;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function unlock(code){
  const raw=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0)), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code.trim()),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)));
}
function refs(r){return r&&r.length?`<div class="refs">${r.map(x=>`<div class="ref"><b>${esc(x.s)}</b> ${esc(x.v)}</div>`).join("")}</div>`:""}
function qHtml(q){
  if(q.k==="ok") return `<div class="q" data-q="${q.id}"><p class="qt">${esc(q.t)}</p>${refs(q.r)}
   <div class="seg" role="radiogroup" aria-label="${esc(q.t)}">
   <label class="y"><input type="radio" name="${q.id}" value="dung">✓ Đúng</label>
   <label class="s"><input type="radio" name="${q.id}" value="sua">✎ Sửa</label>
   <label class="u"><input type="radio" name="${q.id}" value="khongro">? Không rõ</label></div>
   <div class="fix"><input type="text" id="${q.id}__v" placeholder="Mức đúng là…"></div>
   <p class="note">${q.n?esc(q.n)+" — ":""}ghi chú (áp dụng khi nào, ngoại lệ):</p><input type="text" id="${q.id}__n"></div>`;
  if(q.k==="txt") return `<div class="q"><label class="qt" for="${q.id}">${esc(q.t)}</label>${q.h?`<p class="note" style="margin:-4px 0 8px">${esc(q.h)}</p>`:""}<textarea id="${q.id}"></textarea></div>`;
  return `<div class="q"><p class="qt">${esc(q.t)}</p>${refs(q.r)}${q.o.map((o,i)=>`<label class="opt"><input type="${q.m?"checkbox":"radio"}" name="${q.id}" value="${esc(o)}">${esc(o)}</label>`).join("")}
   <input type="text" id="${q.id}__n" placeholder="Ghi chú (nếu có)"></div>`;
}
function render(){
  $("#form").innerHTML=SPEC.map(s=>`<section class="sec" id="${s.id}"><div class="sh"><div><h2>${esc(s.t)}</h2>${s.d?`<p>${esc(s.d)}</p>`:""}</div>
   ${s.noskip?"":`<label class="skip"><input type="checkbox" id="${s.id}__skip">Phần này tôi không nắm — bỏ qua</label>`}</div>
   <div class="sb">${s.q.map(qHtml).join("")}</div></section>`).join("");
  $("#form").addEventListener("input",onChange);$("#form").addEventListener("change",onChange);
}
function allQ(){return SPEC.flatMap(s=>s.q.map(q=>({...q,sec:s})))}
function collect(){
  const d={phieu:"B1",luc:new Date().toISOString(),bo_qua:[],tra_loi:{}};
  SPEC.forEach(s=>{const sk=$("#"+s.id+"__skip");if(sk&&sk.checked)d.bo_qua.push(s.id)});
  allQ().forEach(q=>{let a={};
    if(q.k==="ok"){const c=document.querySelector(`input[name="${q.id}"]:checked`);a={chon:c?c.value:"",sua:$("#"+q.id+"__v").value.trim(),ghi_chu:$("#"+q.id+"__n").value.trim()}}
    else if(q.k==="txt"){a={chu:$("#"+q.id).value.trim()}}
    else{a={chon:[...document.querySelectorAll(`input[name="${q.id}"]:checked`)].map(x=>x.value),ghi_chu:$("#"+q.id+"__n").value.trim()}}
    d.tra_loi[q.id]=a});
  return d;
}
function restore(d){
  (d.bo_qua||[]).forEach(id=>{const sk=$("#"+id+"__skip");if(sk)sk.checked=true});
  allQ().forEach(q=>{const a=(d.tra_loi||{})[q.id];if(!a)return;
    if(q.k==="ok"){if(a.chon){const r=document.querySelector(`input[name="${q.id}"][value="${a.chon}"]`);if(r)r.checked=true}$("#"+q.id+"__v").value=a.sua||"";$("#"+q.id+"__n").value=a.ghi_chu||""}
    else if(q.k==="txt"){$("#"+q.id).value=a.chu||""}
    else{(a.chon||[]).forEach(v=>document.querySelectorAll(`input[name="${q.id}"]`).forEach(x=>{if(x.value===v)x.checked=true}));$("#"+q.id+"__n").value=a.ghi_chu||""}});
}
function answered(d){return allQ().filter(q=>{const a=d.tra_loi[q.id];return d.bo_qua.includes(q.sec.id)||(q.k==="ok"?a.chon:q.k==="txt"?a.chu:a.chon.length)}).length}
function onChange(){
  document.querySelectorAll(".q[data-q]").forEach(el=>{const c=el.querySelector("input[type=radio]:checked");el.classList.toggle("fixing",!!c&&c.value==="sua")});
  SPEC.forEach(s=>{const sk=$("#"+s.id+"__skip");if(sk)$("#"+s.id).classList.toggle("skipped",sk.checked)});
  const d=collect(),n=answered(d),t=allQ().length;$("#bar").style.width=(n/t*100)+"%";$("#st").textContent=`Đã trả lời ${n}/${t} · tự lưu`;
  try{localStorage.setItem(LS,JSON.stringify(d))}catch(e){$("#st").textContent="Máy không cho tự lưu — nhớ bấm Xong trước khi đóng"}
}
function asText(d){
  const L=[`PHIẾU B1 — ${d.tra_loi.ten.chu||"(chưa ghi tên)"} — ${new Date(d.luc).toLocaleString("vi-VN")}`];
  const nm={dung:"ĐÚNG",sua:"SỬA",khongro:"KHÔNG RÕ"};
  SPEC.forEach(s=>{if(d.bo_qua.includes(s.id)){L.push(`\n[${s.t}] — bỏ qua`);return}L.push(`\n[${s.t}]`);
    s.q.forEach(q=>{const a=d.tra_loi[q.id];let v="";
      if(q.k==="ok"){if(!a.chon&&!a.ghi_chu)return;v=(nm[a.chon]||"—")+(a.chon==="sua"&&a.sua?` → ${a.sua}`:"")+(a.ghi_chu?` | ${a.ghi_chu}`:"")}
      else if(q.k==="txt"){if(!a.chu)return;v=a.chu}
      else{if(!a.chon.length&&!a.ghi_chu)return;v=a.chon.join("; ")+(a.ghi_chu?` | ${a.ghi_chu}`:"")}
      L.push(`• ${q.t}: ${v}`)})});
  return L.join("\n");
}
function msg(el,t,cls){el.innerHTML=`<div class="msg ${cls}">${esc(t)}</div>`}
$("#open").onclick=async()=>{const c=$("#code").value;if(!c.trim())return;
  try{SPEC=await unlock(c)}catch(e){msg($("#lmsg"),"Mã chưa đúng — kiểm lại chữ hoa/thường và dấu gạch.","err");return}
  $("#lock").hidden=true;$("#form").hidden=false;$("#bb").hidden=false;render();
  try{const s=localStorage.getItem(LS);if(s)restore(JSON.parse(s))}catch(e){}onChange()};
$("#code").addEventListener("keydown",e=>{if(e.key==="Enter")$("#open").click()});
$("#done").onclick=()=>{const d=collect();$("#out").textContent=asText(d);$("#exp").hidden=false;$("#exp").scrollIntoView({behavior:"smooth"})};
$("#copy").onclick=()=>{const t=$("#out").textContent;navigator.clipboard.writeText(t).then(()=>msg($("#emsg"),"Đã chép — dán vào Zalo gửi anh Hiến.","ok"),
  ()=>{const r=document.createRange();r.selectNodeContents($("#out"));const s=getSelection();s.removeAllRanges();s.addRange(r);msg($("#emsg"),"Máy không cho chép tự động — chữ đã được bôi đen, bấm giữ để chép.","err")})};
$("#dl").onclick=()=>{const d=collect(),b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=`seikin_b1_${(d.tra_loi.ten.chu||"nhanvien").replace(/\s+/g,"_")}_${d.luc.slice(0,10)}.json`;a.click()};
$("#clear").onclick=()=>{if($("#clear").dataset.arm){try{localStorage.removeItem(LS)}catch(e){}render();onChange();$("#clear").textContent="Xoá hết";delete $("#clear").dataset.arm}
  else{$("#clear").dataset.arm=1;$("#clear").textContent="Bấm lần nữa để xoá";setTimeout(()=>{$("#clear").textContent="Xoá hết";delete $("#clear").dataset.arm},3000)}};
</script></body></html>
